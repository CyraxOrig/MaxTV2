<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Макс ТВ 2</title>
    <style>
        /* Сброс и базовые настройки */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a1f44, #1e3a8a, #3b82f6, #60a5fa, #3b82f6, #1e3a8a, #0a1f44);
            background-size: 400% 400%;
            animation: waveGradient 15s ease infinite;
            padding: 1.5rem;
            transition: all 0.3s ease;
        }

        /* Бесконечная анимация градиента: синий -> голубой -> синий */
        @keyframes waveGradient {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        /* Основной контейнер — минимализм, стеклянный эффект */
        .card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 2rem;
            padding: 2.2rem 2rem 2.2rem 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.1);
            max-width: 800px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* Заголовок */
        h1 {
            font-weight: 400;
            font-size: 2.8rem;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 2px 15px rgba(0, 120, 255, 0.7);
            margin-bottom: 0.4rem;
            text-align: center;
            line-height: 1.2;
        }

        .subhead {
            font-weight: 300;
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.75);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 0.75rem;
            width: 100%;
            text-align: center;
        }

        /* Обёртка плеера, чтобы iframe был адаптивным */
        .player-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            border-radius: 1.2rem;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.1);
            transition: box-shadow 0.3s ease;
        }

        .player-wrapper:hover {
            box-shadow: 0 10px 40px rgba(0, 180, 255, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.25);
        }

        /* Стили для iframe — адаптивность через проценты и фиксированное соотношение */
        .player-wrapper iframe {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            border: none;
            background: #000;
        }

        /* Минималистичный футер с названием канала и приглушённым текстом */
        .footer-note {
            margin-top: 1.8rem;
            font-size: 0.85rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-align: center;
        }

        .footer-note span {
            opacity: 0.8;
        }

        /* Небольшая точка-разделитель */
        .dot {
            font-size: 1.5rem;
            line-height: 0.8;
            color: rgba(255, 255, 255, 0.3);
            margin: 0 0.2rem;
        }

        /* Адаптив для мобильных */
        @media (max-width: 600px) {
            .card {
                padding: 1.5rem 1rem;
                border-radius: 1.5rem;
            }

            h1 {
                font-size: 2rem;
            }

            .subhead {
                font-size: 0.8rem;
                letter-spacing: 1px;
                margin-bottom: 1.5rem;
            }

            .footer-note {
                font-size: 0.7rem;
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Макс ТВ 2</h1>
        <div class="subhead">прямой эфир</div>

        <!-- Плеер catcast.tv с адаптивной вёрсткой -->
        <div class="player-wrapper">
            <iframe 
                src="https://catcast.tv/player/51966" 
                frameborder="0" 
                allowfullscreen
                title="Макс ТВ 2 — прямой эфир">
            </iframe>
        </div>

        <div class="footer-note">
            <span>Макс ТВ 2</span>
            <span class="dot">•</span>
            <span>всегда с тобой</span>
        </div>
    </div>
</body>
</html>
