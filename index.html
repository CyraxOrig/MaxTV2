<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Макс ТВ 2</title>
    <style>
        /* Сброс и базовые настройки */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #05060f;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 150, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 220, 255, 0.1) 0%, transparent 50%);
            padding: 1.5rem;
            color: #fff;
        }

        /* Основной контейнер — неоновая карточка */
        .card {
            background: rgba(5, 10, 25, 0.85);
            border-radius: 1.5rem;
            padding: 2.5rem 2rem;
            max-width: 820px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            border: 1px solid #00b4ff;
            box-shadow: 
                0 0 15px rgba(0, 180, 255, 0.6),
                0 0 40px rgba(0, 180, 255, 0.3),
                0 0 80px rgba(0, 180, 255, 0.15),
                inset 0 0 30px rgba(0, 180, 255, 0.05);
        }

        /* Заголовок с неоновым свечением */
        h1 {
            font-weight: 700;
            font-size: 3rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow: 
                0 0 5px #ffffff,
                0 0 10px #00b4ff,
                0 0 20px #00b4ff,
                0 0 40px #0080ff,
                0 0 80px #0080ff;
            margin-bottom: 0.5rem;
            text-align: center;
            line-height: 1.2;
        }

        /* Подзаголовок с мягким неоном */
        .subhead {
            font-weight: 300;
            font-size: 0.95rem;
            color: #7fd8ff;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 2rem;
            padding-bottom: 0.85rem;
            width: 100%;
            text-align: center;
            border-bottom: 1px solid rgba(0, 180, 255, 0.4);
            text-shadow: 0 0 8px rgba(0, 180, 255, 0.7);
        }

        /* Обёртка плеера с неоновой рамкой */
        .player-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            border-radius: 0.8rem;
            overflow: hidden;
            border: 2px solid #00c8ff;
            box-shadow: 
                0 0 15px rgba(0, 200, 255, 0.7),
                0 0 35px rgba(0, 150, 255, 0.4),
                inset 0 0 20px rgba(0, 200, 255, 0.1);
            transition: box-shadow 0.3s ease;
        }

        .player-wrapper:hover {
            box-shadow: 
                0 0 25px rgba(0, 200, 255, 0.9),
                0 0 55px rgba(0, 150, 255, 0.6),
                inset 0 0 25px rgba(0, 200, 255, 0.2);
        }

        /* Стили для iframe — адаптивность через проценты */
        .player-wrapper iframe {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            border: none;
            background: #000;
        }

        /* Неоновый футер */
        .footer-note {
            margin-top: 2rem;
            font-size: 0.85rem;
            font-weight: 300;
            color: #7fd8ff;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-align: center;
            text-shadow: 0 0 6px rgba(0, 180, 255, 0.6);
        }

        .dot {
            font-size: 1.5rem;
            line-height: 0.8;
            color: #00c8ff;
            text-shadow: 0 0 10px #00c8ff, 0 0 20px #0080ff;
            margin: 0 0.3rem;
        }

        /* Адаптив для мобильных */
        @media (max-width: 600px) {
            .card {
                padding: 1.8rem 1.2rem;
                border-radius: 1.2rem;
            }

            h1 {
                font-size: 1.8rem;
                letter-spacing: 2px;
            }

            .subhead {
                font-size: 0.7rem;
                letter-spacing: 3px;
                margin-bottom: 1.5rem;
            }

            .footer-note {
                font-size: 0.7rem;
                letter-spacing: 1px;
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Макс ТВ 2</h1>
        <div class="subhead">прямой эфир</div>

        <!-- Плеер catcast.tv с адаптивной вёрсткой -->
        <div class="player-wrapper">
            <iframe 
                src="https://catcast.tv/player/51966" 
                frameborder="0" 
                allowfullscreen
                title="Макс ТВ 2 — прямой эфир">
            </iframe>
        </div>

        <div class="footer-note">
            <span>Макс ТВ 2</span>
            <span class="dot">•</span>
            <span>always on air</span>
        </div>
    </div>
</body>
</html>
